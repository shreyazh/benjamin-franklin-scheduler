<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benjamin Franklin Scheduler</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Special Elite', cursive;
      background: #f4ecd8;
      color: #2f2f2f;
      padding: 40px;
      max-width: 700px;
      margin: auto;
    }
    h1, h2 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    .home-page, .main-scheduler {
      display: none;
    }
    .visible {
      display: block;
    }
    .btn {
      margin: 20px auto;
      display: block;
      background-color: #8b5e3c;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 10px;
      cursor: pointer;
    }
    .scheduler-form {
      background-color: #fff8e1;
      padding: 20px;
      border: 2px dashed #8b5e3c;
      border-radius: 15px;
      box-shadow: 2px 2px 5px #999;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #b28b6e;
      border-radius: 8px;
      background-color: #fff;
      margin-top: 5px;
    }
    .time-block {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }
    .time-block label {
      width: 60px;
      margin-top: 0;
    }
    .time-block textarea {
      flex: 1;
      margin-left: 10px;
    }
    #confirmation {
      margin-top: 30px;
      padding: 20px;
      background-color: #d9cbb1;
      border: 1px solid #8b5e3c;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Home Page -->
  <div class="home-page visible" id="home">
    <h1>Welcome to the Benjamin Franklin Scheduler</h1>
    <p style="text-align:center">Plan your day the Franklin way.</p>
    <button class="btn" onclick="goToScheduler()">Create My Schedule</button>
  </div>

  <!-- Main Scheduler Page -->
  <div class="main-scheduler" id="schedulerPage">
    <h2>Benjamin Franklin's Schedule</h2>
    <form id="scheduler" class="scheduler-form">
      <label for="name">Your Name:</label>
      <input type="text" id="name" required>

      <label>Daily Time Blocks:</label>
      <div id="timeBlocks"></div>

      <label for="goals">Goals for Today:</label>
      <textarea id="goals" rows="3" required></textarea>

      <button type="submit" class="btn">Save My Schedule</button>
    </form>

    <div id="confirmation">
      <h2>Success!</h2>
      <p>Your Benjamin Franklin-style schedule has been saved. Click below to download it as a PDF. Created By <a href="https://www.linkedin.com/in/shreyashsrivastva">Shreyash Srivastva. </a></p>
      <button class="btn" onclick="downloadPDF()">Download PDF</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const form = document.getElementById('scheduler');
    const confirmation = document.getElementById('confirmation');
    const home = document.getElementById('home');
    const schedulerPage = document.getElementById('schedulerPage');
    const timeBlocksContainer = document.getElementById('timeBlocks');

    function goToScheduler() {
      home.classList.remove('visible');
      schedulerPage.classList.add('visible');
    }

    // Generate time blocks from 5 AM to 4 AM next day (24 slots)
    const hours = [
      '5 AM','6 AM','7 AM','8 AM','9 AM','10 AM','11 AM',
      '12 PM','1 PM','2 PM','3 PM','4 PM','5 PM','6 PM',
      '7 PM','8 PM','9 PM','10 PM','11 PM',
      '12 AM','1 AM','2 AM','3 AM','4 AM'
    ];

    hours.forEach(hour => {
      const block = document.createElement('div');
      block.className = 'time-block';
      block.innerHTML = `
        <label>${hour}</label>
        <textarea rows="2" data-hour="${hour}"></textarea>
      `;
      timeBlocksContainer.appendChild(block);
    });

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      confirmation.style.display = 'block';
    });

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const name = document.getElementById('name').value;
      const goals = document.getElementById('goals').value;
      const timeBlocks = document.querySelectorAll('.time-block textarea');

      doc.setFont("courier", "normal");
      doc.setFontSize(12);
      doc.text("Benjamin Franklin Schedule", 10, 10);
      doc.text(`Name: ${name}`, 10, 20);

      let y = 30;
      timeBlocks.forEach(block => {
        const hour = block.getAttribute('data-hour');
        const text = block.value;
        const wrappedText = doc.splitTextToSize(`${hour}: ${text}`, 180);
        if (y + wrappedText.length * 10 > 270) {
          doc.addPage();
          y = 10;
        }
        wrappedText.forEach(line => {
          doc.text(line, 10, y);
          y += 10;
        });
      });

      if (y > 250) {
        doc.addPage();
        y = 10;
      }
      doc.text(`Goals:`, 10, y);
      y += 10;
      const wrappedGoals = doc.splitTextToSize(goals, 180);
      wrappedGoals.forEach(line => {
        doc.text(line, 10, y);
        y += 10;
      });

      doc.save(`${name}_Schedule.pdf`);
    }
  </script>
</body>
</html>
